    <ellipse rx="410" ry="106" fill="none" stroke="#f2b57b" stroke-opacity=".2" stroke-width="42" filter="url(#blur)"/>
    <ellipse rx="315" ry="72" fill="none" stroke="#d8d7c9" stroke-opacity=".32" stroke-width="22"/>
    <circle r="215" fill="url(#core)" filter="url(#blur)"/>
