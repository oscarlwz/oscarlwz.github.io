    <circle cx="958" cy="161" r="2.5"/><circle cx="1104" cy="271" r="1.6"/><circle cx="1250" cy="90" r="2"/>
    <circle cx="1410" cy="225" r="3"/><circle cx="1578" cy="128" r="1.7"/><circle cx="1770" cy="298" r="2.4"/>
    <circle cx="1942" cy="104" r="2"/><circle cx="1855" cy="505" r="1.8"/><circle cx="1635" cy="420" r="2.5"/>
    <circle cx="1492" cy="610" r="1.7"/><circle cx="1950" cy="746" r="3"/><circle cx="1720" cy="880" r="2"/>
    <circle cx="190" cy="720" r="2.5"/><circle cx="390" cy="562" r="1.6"/><circle cx="608" cy="780" r="2"/>
    <circle cx="133" cy="1050" r="3"/><circle cx="340" cy="1240" r="2"/><circle cx="590" cy="1450" r="1.8"/>
    <circle cx="887" cy="1320" r="2.7"/><circle cx="1170" cy="1510" r="2"/><circle cx="1440" cy="1360" r="3"/>
