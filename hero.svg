<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1651" role="img" aria-labelledby="title description">
  <title id="title">Cosmic galaxy outflow</title>
  <desc id="description">An abstract galaxy with luminous gas flowing from its center into a field of stars.</desc>
  <defs>
    <radialGradient id="space" cx="72%" cy="42%" r="76%">
      <stop offset="0" stop-color="#315e74"/>
      <stop offset=".38" stop-color="#172f40"/>
      <stop offset="1" stop-color="#071019"/>
    </radialGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#fff8db"/>
      <stop offset=".12" stop-color="#ffcf89" stop-opacity=".96"/>
      <stop offset=".38" stop-color="#df6b47" stop-opacity=".62"/>
      <stop offset="1" stop-color="#d75938" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wind" x1="0" x2="1">
      <stop stop-color="#f9b878" stop-opacity="0"/>
      <stop offset=".45" stop-color="#e77a4e" stop-opacity=".35"/>
      <stop offset=".7" stop-color="#8cc5cd" stop-opacity=".16"/>
      <stop offset="1" stop-color="#8cc5cd" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect width="2048" height="1651" fill="url(#space)"/>
  <g fill="#f7efe0">
    <circle cx="111" cy="126" r="2"/><circle cx="225" cy="310" r="3"/><circle cx="355" cy="95" r="1.8"/>
