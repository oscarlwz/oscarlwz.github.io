name: Replace site with Weizhe Liu research website

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare static homepage
        shell: bash
        run: |
          cat .github/workflows/site-part-*.txt | base64 --decode > /tmp/weizhe-liu.html.gz
          gzip --decompress --stdout /tmp/weizhe-liu.html.gz > /tmp/index.html
          grep -q "Weizhe Liu" /tmp/index.html

      - name: Replace main branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .
          cp /tmp/index.html index.html
          cp /tmp/index.html 404.html
          touch .nojekyll
          git add -A
          git commit -m "Replace site with Weizhe Liu research website"
          git push origin HEAD:main

      - name: Publish matching GitHub Pages branch
        shell: bash
        run: |
          git switch -C gh-pages origin/gh-pages
          git rm -r .
          cp /tmp/index.html index.html
          cp /tmp/index.html 404.html
          touch .nojekyll
          git add -A
          git commit -m "Deploy Weizhe Liu research website"
          git push origin gh-pages
